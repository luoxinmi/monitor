<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>market</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0e14; color: #e6edf3; font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; color: #9fb0c8; }
  .sub { color: #6b7a90; font-size: 12px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .card { background: #131926; border: 1px solid #1f2a3d; border-radius: 10px; padding: 10px 12px; }
  .k { color: #7d8ca3; font-size: 12px; }
  .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .v small { font-size: 12px; color: #7d8ca3; font-weight: 400; }
  canvas { width: 100%; height: 140px; display: block; background: #0f1420; border: 1px solid #1f2a3d; border-radius: 10px; }
  .chart-title { font-size: 12px; color: #7d8ca3; margin: 14px 0 6px; }
  #alerts { margin-top: 14px; }
  .alert { background: #2a1a1a; border: 1px solid #5a2a2a; color: #ff9b9b; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
  .ok { color: #4ade80; font-size: 13px; }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
<h1>行情</h1>
<div class="sub" id="ts">加载中…</div>
<div class="grid" id="cards"></div>
<div class="chart-title">价格</div>
<canvas id="c1" height="140"></canvas>
<div class="chart-title">持仓量（OI, 百万美元）</div>
<canvas id="c2" height="140"></canvas>
<div class="chart-title">±1% 买盘深度（千美元）</div>
<canvas id="c3" height="140"></canvas>
<div class="chart-title">保险基金（币安组，百万美元）· 来自 fund-watch</div>
<canvas id="c4" height="140"></canvas>
<div id="alerts"></div>

<script>
const BASE = './data/EVAA/';
const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => (v === null || v === undefined) ? '—' : Number(v).toFixed(d);
const fmtK = v => v == null ? '—' : (v >= 1e6 ? (v/1e6).toFixed(1) + 'M' : (v/1e3).toFixed(1) + 'K');

function draw(id, data, key, color, mul = 1) {
  const c = $(id), ctx = c.getContext('2d');
  const W = c.width = c.clientWidth * devicePixelRatio;
  const H = c.height = c.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  const vals = data.map(x => Number(x[key]) * mul).filter(v => isFinite(v));
  if (vals.length < 2) return;
  const min = Math.min(...vals), max = Math.max(...vals), pad = (max - min) * 0.12 || 1;
  const sx = W / (vals.length - 1), sy = (H - 20) / (max - min + pad * 2);
  ctx.strokeStyle = color; ctx.lineWidth = 2 * devicePixelRatio;
  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = i * sx, y = H - 10 - (v - min + pad) * sy;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#7d8ca3'; ctx.font = (11 * devicePixelRatio) + 'px sans-serif';
  ctx.fillText(max.toFixed(2), 4, 12 * devicePixelRatio);
  ctx.fillText(min.toFixed(2), 4, H - 4);
}

const FUND_URL = () => {
  const d = new Date();
  const ym = d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, '0');
  return `https://raw.githubusercontent.com/luoxinmi/fund-watch/main/data/fund/${ym}.jsonl`;
};

async function refresh() {
  try {
    const [r, h, f] = await Promise.all([
      fetch(BASE + 'latest.json?t=' + Date.now()).then(x => x.json()),
      fetch(BASE + 'history.jsonl?t=' + Date.now()).then(x => x.text()).catch(() => ''),
      fetch(FUND_URL() + '?t=' + Date.now()).then(x => x.text()).catch(() => ''),
    ]);
    const fundRows = (f || '').trim().split('\n').filter(Boolean).map(x => {
      try { return JSON.parse(x) } catch (e) { return null }
    }).filter(x => x && x.sym === 'EVAA');
    const fund = fundRows.length ? (fundRows[fundRows.length - 1].group_fund_usdt / 1e6) : null;
    const s = r.snapshot || {};
    $('ts').textContent = new Date(r.updated * 1000).toLocaleString() + ' 更新 · 源 ' + (s.source || '—');
    $('cards').innerHTML = [
      ['价格', '$' + fmt(s.price, 4), '24h ' + (fmt(s.price_24h_pct) + '%')],
      ['OI', '$' + fmtK(s.oi_usd), ''],
      ['资金费率', fmt(s.funding_pct, 4) + '%', '/8h'],
      ['±1% 买盘', '$' + fmtK(s.depth_1pct_usd), ''],
      ['基金(币安组)', fund == null ? '—' : ('$' + fmtK(fund)), '全所池'],
    ].map(([k, v, d]) => `<div class="card"><div class="k">${k}</div><div class="v">${v} <small>${d}</small></div></div>`).join('');
    const hist = h.trim().split('\n').filter(Boolean).map(x => { try { return JSON.parse(x) } catch (e) { return null } }).filter(Boolean).slice(-48);
    draw('c1', hist, 'price', '#4ade80', 1);
    draw('c2', hist, 'oi', '#38bdf8', 1 / 1e6);
    draw('c3', hist, 'depth', '#fbbf24', 1 / 1e3);
    draw('c4', fundRows.slice(-48), 'group_fund_usdt', '#a78bfa', 1 / 1e6);
    $('alerts').innerHTML = (r.alerts && r.alerts.length)
      ? r.alerts.map(a => `<div class="alert">${a}</div>`).join('')
      : '<div class="ok">无异常</div>';
  } catch (e) {
    $('ts').textContent = '加载失败：' + e.message;
  }
}
refresh();
setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
