name: probe3
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: www.binance.com fapi passthrough
        run: |
          echo "--- insuranceBalance body ---"
          curl -s -m 15 "https://www.binance.com/fapi/v1/insuranceBalance?limit=3" | head -c 400; echo
          echo "--- openInterest ---"
          curl -s -m 15 "https://www.binance.com/fapi/v1/openInterest?symbol=ETHUSDT" | head -c 200; echo
          echo "--- topLongShort ---"
          curl -s -m 15 "https://www.binance.com/futures/data/topLongShortPositionRatio?symbol=ETHUSDT&period=1h&limit=1" | head -c 300; echo
          echo "--- klines ---"
          curl -s -m 15 "https://www.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=4h&limit=1" | head -c 200; echo
          echo "--- premiumIndex ---"
          curl -s -m 15 "https://www.binance.com/fapi/v1/premiumIndex?symbol=ETHUSDT" | head -c 200; echo
