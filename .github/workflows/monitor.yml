name: coin-monitor

on:
  schedule:
    - cron: "7 * * * *" # 每小时（避开整点：官方说整点高负载会延迟甚至丢任务）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 同一时间只跑一个币，避免 matrix 并行时 git push 互相冲突
    concurrency:
      group: monitor-commit
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # 多币监控：加名字即可（每币独立 data/<SYM>/）
        symbol: [EVAA, BONK]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install requests

      - name: run monitor
        id: mon
        run: |
          set +e
          mkdir -p "data/${{ matrix.symbol }}"
          python scripts/monitor.py --symbol "${{ matrix.symbol }}" --min-amount 3000 --out "data/${{ matrix.symbol }}" --json > "data/${{ matrix.symbol }}/latest.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: sample fund (binance group + gate)
        run: python3 scripts/fund_watch.py --symbols EVAA,BONK --out data/fund || true

      - name: commit state
        run: |
          git config user.name "dsh-monitor"
          git config user.email "dsh-monitor@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push; then break; fi
            echo "push 冲突，重试 $i"; sleep $((i * 5))
          done

      - name: webhook (optional)
        if: steps.mon.outputs.code == '2'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "no webhook, skip"; exit 0; fi
          python - <<'PY'
          import json, os, urllib.request
          d = json.load(open(f"data/${{ matrix.symbol }}/latest.json"))
          msg = "\n".join([f"{d['symbol']} 监控异常"] + d["alerts"])
          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps({"content": msg}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=10)
          print("webhook sent")
          PY
