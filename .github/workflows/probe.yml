name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: geo + endpoints
        run: |
          echo "=== geo ==="; curl -s -m 10 https://ipinfo.io/json | head -c 300 || true
          echo; echo "=== binance fapi insurance ==="
          curl -s -o /tmp/a.json -w "http=%{http_code}\n" -m 20 "https://fapi.binance.com/fapi/v1/insuranceBalance?limit=5" || true
          head -c 200 /tmp/a.json || true
          echo; echo "=== binance vision ==="
          curl -s -o /dev/null -w "http=%{http_code}\n" -m 20 "https://data-api.binance.vision/api/v3/ping" || true
          echo "=== binance www bapi ==="
          curl -s -o /dev/null -w "http=%{http_code}\n" -m 20 -X POST "https://www.binance.com/bapi/futures/v1/friendly/future/common/brackets" -H 'Content-Type: application/json' -d '{"symbol":"ETHUSDT"}' || true
          echo "=== gate ==="
          curl -s -o /dev/null -w "http=%{http_code}\n" -m 20 "https://api.gateio.ws/api/v4/futures/usdt/insurance" || true
          echo "=== bybit ==="
          curl -s -o /dev/null -w "http=%{http_code}\n" -m 20 "https://api.bybit.com/v5/market/time" || true
